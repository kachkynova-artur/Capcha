<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CaptchaLab{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #f4f6fa; color: #1f2933; }
        header { background: #1f3a5f; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
        header a, header button { color: #fff; text-decoration: none; margin-left: 16px; background: none; border: 0; font: inherit; cursor: pointer; }
        header form { display: inline; }
        main { max-width: 460px; margin: 40px auto; background: #fff; padding: 28px 32px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.07); }
        h1 { font-size: 22px; margin-top: 0; }
        label { display: block; font-weight: 600; margin: 14px 0 4px; }
        input[type=text], input[type=password], input[type=email] { width: 100%; padding: 9px 10px; border: 1px solid #c7cfd9; border-radius: 6px; font-size: 15px; }
        .btn { display: inline-block; margin-top: 18px; padding: 10px 18px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; font-size: 15px; cursor: pointer; text-decoration: none; }
        .btn.secondary { background: #64748b; }
        .errorlist { color: #b91c1c; margin: 4px 0; padding-left: 18px; font-size: 14px; }
        .helptext { color: #64748b; font-size: 12px; display: block; margin-top: 3px; }
        .messages { list-style: none; padding: 0; }
        .messages li { padding: 10px 12px; border-radius: 6px; margin-bottom: 8px; background: #e0f2fe; }
        .messages li.success { background: #dcfce7; }
        .captcha-row { display: flex; align-items: center; gap: 12px; }
        table.info { width: 100%; border-collapse: collapse; }
        table.info td { padding: 8px 4px; border-bottom: 1px solid #e5e7eb; }
        table.info td:first-child { color: #64748b; width: 40%; }
    </style>
</head>
<body>
<header>
    <strong>CaptchaLab</strong>
    <nav>
        {% if user.is_authenticated %}
            <a href="{% url 'profile' %}">Личный кабинет</a>
            <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Выйти</button></form>
        {% else %}
            <a href="{% url 'login' %}">Вход</a>
            <a href="{% url 'register' %}">Регистрация</a>
        {% endif %}
    </nav>
</header>
<main>
    {% if messages %}
        <ul class="messages">
            {% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}
        </ul>
    {% endif %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
